<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<link rel="manifest" href="./manifest.webmanifest"><title>DALZON CITY</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08111f;color:#fff;font-family:Inter,system-ui,Arial;touch-action:none}#game{position:fixed;inset:0}canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none}.brand,#stats,#mission,#hint{position:absolute;background:#071321c9;border:1px solid #ffffff25;backdrop-filter:blur(12px);border-radius:14px;padding:10px 13px}.brand{top:13px;left:13px}.brand b{letter-spacing:2px;font-size:13px}.brand small{display:block;color:#8fb2c9;font-size:9px;letter-spacing:2px;margin-top:3px}#stats{right:13px;top:13px;text-align:right;font-size:12px}#mission{top:14px;left:50%;transform:translateX(-50%);font-size:11px;white-space:nowrap}#hint{bottom:145px;left:50%;transform:translateX(-50%);font-size:11px;white-space:nowrap}#controls{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 17px;pointer-events:none}.pad{display:grid;grid-template-columns:54px 54px 54px;grid-template-rows:54px 54px;gap:5px;pointer-events:auto}.ctrl{border:1px solid #ffffff45;background:#071321c9;color:white;border-radius:15px;font-size:21px;touch-action:none;user-select:none}.ctrl:active,.ctrl.active{background:#168f87}#right{display:flex;flex-direction:column;gap:8px;align-items:end;pointer-events:auto}#drive{padding:14px 17px;font-size:11px;font-weight:800;letter-spacing:1px;border-radius:15px;background:#0b9489;border:1px solid #6ce5d7;color:white}#brake{width:65px;height:52px;font-size:10px}#toast{position:absolute;top:65px;left:50%;transform:translateX(-50%);background:#0b9489;padding:9px 14px;border-radius:12px;font-size:12px;opacity:0;transition:opacity .2s}
#loading{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#17364a,#08111f 65%)}.loadbox{text-align:center}.loadbox strong{font-size:25px;letter-spacing:4px}.loadbox p{color:#9ab5c7;font-size:12px}.bar{width:190px;height:3px;background:#294456;margin:20px auto;overflow:hidden}.bar i{display:block;height:100%;width:35%;background:#4ee0cf;animation:load 1.3s infinite}@keyframes load{to{transform:translateX(550%)}}@media(min-width:800px){.pad{grid-template-columns:64px 64px 64px;grid-template-rows:64px 64px}#controls{padding:0 35px 24px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script></head>
<body><div id="game"></div><div id="loading"><div class="loadbox"><strong>DALZON CITY</strong><p>CHARGEMENT DE LA VILLE...</p><div class="bar"><i></i></div><small>Prototype 3D • Monde ouvert</small></div></div>
<div id="hud"><div class="brand"><b>DALZON CITY</b><small>OPEN WORLD • PROTOTYPE</small></div><div id="mission">EXPLORE LA VILLE LIBREMENT</div><div id="stats"><div id="mode">MODE PIÉTON</div><div style="color:#73d9cb;margin-top:5px">VITESSE <span id="speed">0</span> km/h</div></div><div id="toast"></div><div id="hint">Approche-toi d’une voiture pour monter</div>
<div id="controls"><div class="pad"><div></div><button class="ctrl" data-key="forward">▲</button><div></div><button class="ctrl" data-key="left">◀</button><button class="ctrl" data-key="back">▼</button><button class="ctrl" data-key="right">▶</button></div><div id="right"><button class="ctrl" id="brake">FREIN</button><button id="drive">MONTER EN VOITURE</button></div></div></div>
<script type="module">
import * as THREE from 'three';
const root=document.querySelector('#game'),scene=new THREE.Scene();scene.background=new THREE.Color(0x91b6c8);scene.fog=new THREE.Fog(0x91b6c8,90,330);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,700);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd8efff,0x53604e,2));const sun=new THREE.DirectionalLight(0xffedcf,2.2);sun.position.set(-70,110,45);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-100;sun.shadow.camera.right=100;sun.shadow.camera.top=100;sun.shadow.camera.bottom=-100;scene.add(sun);
const mat=(c,r=.85,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
function box(w,h,d,material,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(700,700),mat(0x627d70));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const asphalt=mat(0x252d35),mark=mat(0xe7e2c9),curb=mat(0xb9b8a9);
for(let i=-5;i<=5;i++){const p=i*34;box(13,.12,370,asphalt,p,.07,0);box(370,.12,13,asphalt,0,.07,p);for(let n=-5;n<=5;n++){const q=n*34;box(.2,.025,3,mark,p,.14,q);box(3,.025,.2,mark,q,.14,p)}box(1,.2,370,curb,p+7,.12,0);box(1,.2,370,curb,p-7,.12,0);box(370,.2,1,curb,0,.12,p+7);box(370,.2,1,curb,0,.12,p-7)}
const palettes=[0x8799a4,0xb2a99a,0x657f8b,0xc2c6c2,0x8d9a9c,0x6b7785].map(c=>mat(c));
const windowMat=mat(0x9ed4dc,.3,.15);
for(let x=-5;x<=5;x++)for(let z=-5;z<=5;z++){const cx=x*34+(Math.random()-.5)*10,cz=z*34+(Math.random()-.5)*10;if(Math.abs(cx%34)<9||Math.abs(cz%34)<9)continue;const w=10+Math.random()*8,d=10+Math.random()*8,h=8+Math.random()*38;box(w,h,d,palettes[Math.floor(Math.random()*palettes.length)],cx,h/2,cz);for(let yy=3;yy<h-2;yy+=3.2)for(let xx=-w/2+1.4;xx<w/2-1;xx+=2.8){const win=new THREE.Mesh(new THREE.BoxGeometry(1.25,1.35,.08),windowMat);win.position.set(cx+xx,yy,cz+d/2+.05);scene.add(win)}}
function makeCar(color,x,z,rot=0){const g=new THREE.Group(),body=new THREE.Mesh(new THREE.BoxGeometry(2.25,.72,4.1),mat(color,.35,.35));body.position.y=.8;body.castShadow=true;g.add(body);const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.72,.8,2),mat(0x263c4b,.22,.35));cabin.position.set(0,1.48,-.2);g.add(cabin);const rubber=mat(0x15191d);for(const sx of [-1,1])for(const sz of [-1.35,1.35]){const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.39,.39,.22,16),rubber);wheel.rotation.z=Math.PI/2;wheel.position.set(sx*1.12,.42,sz);g.add(wheel)}g.position.set(x,0,z);g.rotation.y=rot;scene.add(g);return g}
const cars=[makeCar(0xb73536,5,3),makeCar(0x2476a5,-30,18,Math.PI/2),makeCar(0xc6a64a,34,-28)];
const player=new THREE.Group(),skin=mat(0xb77d5c),shirt=mat(0x172b3c),pants=mat(0x252b38),shoe=mat(0x101419);const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.38,.72,4,8),shirt);torso.position.y=1.25;player.add(torso);const head=new THREE.Mesh(new THREE.SphereGeometry(.27,16,12),skin);head.position.y=2.05;player.add(head);for(const s of [-1,1]){const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.14,.62,4,8),pants);leg.position.set(s*.19,.48,0);player.add(leg);const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.12,.6,4,8),skin);arm.position.set(s*.48,1.3,0);player.add(arm);const foot=new THREE.Mesh(new THREE.BoxGeometry(.28,.14,.42),shoe);foot.position.set(s*.19,.12,.08);player.add(foot)}scene.add(player);
let driving=false,activeCar=null,speed=0,heading=0;const keys={};function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,1800)}
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key,on=e=>{e.preventDefault();keys[k]=true;b.classList.add('active')},off=()=>{keys[k]=false;b.classList.remove('active')};b.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,off))});
addEventListener('keydown',e=>{if(['w','ArrowUp'].includes(e.key))keys.forward=true;if(['s','ArrowDown'].includes(e.key))keys.back=true;if(['a','ArrowLeft'].includes(e.key))keys.left=true;if(['d','ArrowRight'].includes(e.key))keys.right=true;if(e.key==='e')toggleDrive()});addEventListener('keyup',e=>{if(['w','ArrowUp'].includes(e.key))keys.forward=false;if(['s','ArrowDown'].includes(e.key))keys.back=false;if(['a','ArrowLeft'].includes(e.key))keys.left=false;if(['d','ArrowRight'].includes(e.key))keys.right=false});
function updateUI(){document.querySelector('#mode').textContent=driving?'MODE CONDUITE':'MODE PIÉTON';document.querySelector('#drive').textContent=driving?'DESCENDRE':'MONTER EN VOITURE';document.querySelector('#hint').textContent=driving?'▲ accélérer • ▼ ralentir • ◀ ▶ tourner':'Approche-toi d’une voiture pour monter'}
function toggleDrive(){if(!driving){let nearest=null,dist=8;cars.forEach(c=>{const d=c.position.distanceTo(player.position);if(d<dist){dist=d;nearest=c}});if(nearest){activeCar=nearest;driving=true;player.visible=false;toast('Bonne route dans DALZON CITY !')}else toast('Approche-toi d’une voiture pour monter.')}else{player.position.copy(activeCar.position).add(new THREE.Vector3(2,0,0));player.visible=true;driving=false;speed=0;activeCar=null;toast('Tu es descendu du véhicule.')}updateUI()}
document.querySelector('#drive').onclick=toggleDrive;document.querySelector('#brake').addEventListener('pointerdown',()=>keys.back=true);['pointerup','pointercancel','pointerleave'].forEach(ev=>document.querySelector('#brake').addEventListener(ev,()=>keys.back=false));
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04),f=keys.forward,b=keys.back,l=keys.left,r=keys.right;if(driving&&activeCar){if(f)speed=Math.min(speed+17*dt,34);else if(b)speed=Math.max(speed-26*dt,-9);else speed*=Math.pow(.94,dt*60);if(l)activeCar.rotation.y+=1.8*dt*(speed>=0?1:-1);if(r)activeCar.rotation.y-=1.8*dt*(speed>=0?1:-1);activeCar.translateZ(-speed*dt);document.querySelector('#speed').textContent=Math.round(Math.abs(speed)*3.2)}else{const move=f?1:b?-1:0;if(l)heading+=2.4*dt;if(r)heading-=2.4*dt;player.rotation.y=heading;player.translateZ(-move*7*dt);document.querySelector('#speed').textContent='0'}const target=driving?activeCar.position:player.position,angle=driving?activeCar.rotation.y:heading,dist=driving?10:8,height=driving?5.3:4.2,desired=new THREE.Vector3(target.x+Math.sin(angle)*dist,target.y+height,target.z+Math.cos(angle)*dist);camera.position.lerp(desired,1-Math.pow(.001,dt));camera.lookAt(target.x,target.y+1.2,target.z);renderer.render(scene,camera)}animate();
setTimeout(()=>{document.querySelector('#loading').style.display='none';toast('Bienvenue à DALZON CITY')},900);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
